<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кот Тайкун</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#fff3d6;--bg2:#ffd98a;--card:#fffaf0;--tx:#2e1f0f;--mut:#86683f;--acc:#ff9f1c;--acc2:#ffc94d;--line:#f0d49a;--ok:#1b8a4b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10121e;--bg2:#241c45;--card:#1c2038;--tx:#f6f0e2;--mut:#a3a9cc;--acc:#ffb41f;--acc2:#ffd470;--line:#343a63;--ok:#5fe08f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10121e;--bg2:#241c45;--card:#1c2038;--tx:#f6f0e2;--mut:#a3a9cc;--acc:#ffb41f;--acc2:#ffd470;--line:#343a63;--ok:#5fe08f}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background-color:var(--bg);background-image:radial-gradient(120% 60% at 50% 0%,var(--bg2),transparent);color:var(--tx);font:600 16px/1.3 "Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
header{padding:10px 14px 6px}
.top{display:flex;justify-content:space-between;gap:8px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800}
#bal{font-size:42px;font-weight:900;text-align:center;margin:6px 0 8px;letter-spacing:-.5px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .2s}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:10px 14px;display:none}
.view.on{display:block}
#v-tap.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#ham{width:min(300px,42vh,76vw);aspect-ratio:1;border-radius:50%;touch-action:none;background:radial-gradient(circle at 50% 38%,var(--acc2),var(--acc) 72%);box-shadow:0 0 0 9px rgba(255,159,28,.2),0 16px 44px rgba(255,159,28,.5);transition:transform .08s}
#ham svg{width:92%;height:92%;pointer-events:none}
#en{width:min(300px,76vw);text-align:center;font-weight:900;font-size:18px}
#cats{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#2e1f0f}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.card .e{font-size:30px}
.card b{font-size:15px;font-weight:900}
.card small{color:var(--mut);font-size:12px}
.card em{font-style:normal;font-weight:900;color:var(--ok)}
.ft{display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:13px;font-weight:800}
.off{opacity:.5}
.r2{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;text-align:left}
.r2 .e{font-size:28px}
.r2 .t{flex:1;display:flex;flex-direction:column}
.r2 small{color:var(--mut);font-size:13px}
.r2 .p{font-weight:900;white-space:nowrap}
nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;padding:8px 0 10px;font-size:22px;opacity:.55;display:flex;flex-direction:column;align-items:center}
nav button span{font-size:12px;font-weight:800}
nav button.on{opacity:1;box-shadow:inset 0 3px 0 var(--acc)}
.fl{position:fixed;z-index:9;pointer-events:none;font-size:26px;font-weight:900;color:#ffc94d;text-shadow:0 0 3px #5a3500,0 2px 4px rgba(0,0,0,.4);animation:fl .9s ease-out forwards}
@keyframes fl{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-80px)}}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,16px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:10;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
nav button{font-size:20px}
.lb{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.lb.me{box-shadow:0 0 0 2px var(--acc) inset}
.lb .n{width:28px;font-weight:900;text-align:center}
.lb .nm{flex:1;font-weight:800}
.lb .sc{font-weight:900}
.note{color:var(--mut);font-size:13px;margin:4px 0 12px}
h3{margin:16px 0 8px;font-size:17px;font-weight:900}
#ov{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 10px)}
#ov.on{display:flex}
#ovh{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:18px;margin-bottom:10px}
#ovh button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800}
#arena{flex:1;position:relative;overflow:hidden;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.nut{position:absolute;top:-50px;font-size:42px;animation:fall linear forwards;touch-action:none}
@keyframes fall{to{transform:translateY(110vh)}}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;height:100%;align-content:center}
.mc{aspect-ratio:1;border-radius:16px;background:var(--acc);font-size:32px;display:flex;align-items:center;justify-content:center}
.mc.up{background:var(--bg2)}
.mc.ok{background:var(--bg2);opacity:.5}
nav button{font-size:18px}nav button span{font-size:11px}
.tail{transform-origin:140px 172px;animation:wag 1.8s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-8deg)}to{transform:rotate(14deg)}}
.bd{transform-origin:100px 190px;animation:br 3s ease-in-out infinite}
@keyframes br{50%{transform:scaleY(1.03)}}
.hd{transform-origin:100px 110px;animation:sw 4s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotate(0)}30%{transform:rotate(-2deg)}70%{transform:rotate(2deg)}}
.ey{transform-origin:100px 66px;animation:bl 4.5s infinite}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#ham.hit .hd{animation:nod .16s}
@keyframes nod{50%{transform:translateY(4px) rotate(-3deg)}}
#ham.hit .pw{animation:paw .16s}
@keyframes paw{50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){#ham svg *{animation:none!important}}
.inp{width:100%;font:inherit;font-weight:700;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin:6px 0;user-select:text;-webkit-user-select:text}
.arow{display:flex;gap:8px;margin-bottom:6px}
.rn{position:fixed;top:-50px;font-size:34px;pointer-events:none;z-index:25;animation:fall2 3s linear forwards}
@keyframes fall2{to{transform:translateY(115vh) rotate(360deg)}}
.nt{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px}
.nt>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center;max-width:340px;display:flex;flex-direction:column;gap:10px;align-items:center}
.nt p{margin:0}
</style>
</head>
<body>
<div id="app">
<header>
<div class="top"><div class="pill" id="rank"></div><div class="pill">Прибыль в час: +<span id="pph">0</span></div></div>
<div id="bal">🪙 <span id="balv">0</span></div>
<div class="bar"><i id="lvb"></i></div>
</header>
<main>
<section class="view on" id="v-tap">
<button id="ham" aria-label="Тап">
<svg viewBox="0 0 200 200" aria-hidden="true">
<path class="tail" d="M140 172C182 174 194 128 172 106" fill="none" stroke="#e8893a" stroke-width="16" stroke-linecap="round"/>
<g class="bd"><path d="M100 98C62 98 52 150 56 176C58 190 142 190 144 176C148 150 138 98 100 98Z" fill="#f4a259"/><ellipse cx="100" cy="158" rx="26" ry="28" fill="#fff1d9"/><path d="M62 130h12M60 146h12M138 130h-12M140 146h-12" stroke="#d9772b" stroke-width="5" stroke-linecap="round"/></g>
<ellipse class="pw" cx="80" cy="184" rx="15" ry="10" fill="#fff1d9"/><ellipse class="pw" cx="120" cy="184" rx="15" ry="10" fill="#fff1d9"/>
<g class="hd">
<path d="M52 62L56 14L90 40Z" fill="#e8893a"/><path d="M60 54L62 28L80 42Z" fill="#ffb3b8"/>
<path d="M148 62L144 14L110 40Z" fill="#e8893a"/><path d="M140 54L138 28L120 42Z" fill="#ffb3b8"/>
<ellipse cx="100" cy="72" rx="54" ry="46" fill="#f4a259"/>
<path d="M100 30v14M86 33l3 12M114 33l-3 12" stroke="#d9772b" stroke-width="5" stroke-linecap="round"/>
<ellipse cx="100" cy="88" rx="24" ry="17" fill="#fff1d9"/>
<g class="ey"><ellipse cx="78" cy="66" rx="10" ry="12" fill="#8bd450"/><ellipse cx="122" cy="66" rx="10" ry="12" fill="#8bd450"/><ellipse cx="78" cy="66" rx="4" ry="9" fill="#2e1f0f"/><ellipse cx="122" cy="66" rx="4" ry="9" fill="#2e1f0f"/><circle cx="81" cy="62" r="2.5" fill="#fff"/><circle cx="125" cy="62" r="2.5" fill="#fff"/></g>
<path d="M94 78h12l-6 7z" fill="#e2677a"/>
<path d="M100 85v3M100 88q-6 6-12 1M100 88q6 6 12 1" stroke="#2e1f0f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M74 86l-28-4M74 92l-28 4M126 86l28-4M126 92l28 4" stroke="#2e1f0f" stroke-width="2" stroke-linecap="round"/>
<path d="M100 120l-16-9v20zM100 120l16-9v20z" fill="#e63946"/><circle cx="100" cy="120" r="5" fill="#c1121f"/>
</g></svg>
</button>
<div id="en">⚡ <span id="env"></span><div class="bar" style="margin-top:6px"><i id="enb"></i></div></div>
</section>
<section class="view" id="v-mine"><div id="cats"></div><div class="grid" id="list"></div></section>
<section class="view" id="v-boost"><div id="boosts"></div></section>
<section class="view" id="v-games"><div id="gl"></div></section>
<section class="view" id="v-top"><div id="tp"></div></section>
<section class="view" id="v-me"><div id="pf"></div></section>
</main>
<nav>
<button class="on" data-v="tap">🐱<span>Тап</span></button>
<button data-v="mine">⛏️<span>Шахта</span></button>
<button data-v="boost">🚀<span>Бусты</span></button>
<button data-v="games">🎮<span>Игры</span></button>
<button data-v="top">🏆<span>Лидеры</span></button>
<button data-v="me">👤<span>Профиль</span></button>
</nav>
</div>
<div id="toast"></div>
<input type="file" id="pfile" accept="image/*" hidden>
<div id="ov"><div id="ovh"><span id="ovt"></span><button id="ovx">Закрыть</button></div><div id="arena"></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const CN=['Рынки','Команда','Право','Особые'];
const CARDS=[
['fut','📈','Фьючерсы',0,200,16],['mem','🐸','Мем-токены',0,1000,75],['stk','🏦','Стейкинг',0,5000,350],
['dev','🧑‍💻','Разработчики',1,300,22],['mkt','📣','Маркетологи',1,2000,140],['prt','🤝','Партнёры',1,10000,650],
['lic','📜','Лицензия',2,500,35],['law','⚖️','Юристы',2,3000,200],['ins','🛡️','Страховка',2,15000,900],
['rkt','🚀','Ракета на луну',3,25000,1500],['dia','💎','Алмазные руки',3,100000,5800],['exc','🌐','Своя биржа',3,500000,28000]];
const LV=[0,5e3,25e3,1e5,1e6,2e6,1e7,5e7,1e8,1e9];
const LN=['Бронза','Серебро','Золото','Платина','Алмаз','Эпик','Легенда','Мастер','Гранд','Лорд'];
const R=[500,1000,2500,5000,15000,25000,100000];
const B=[['mt','👆','Мультитап','+1 монета за тап',l=>1000*2**l],['el','🔋','Лимит энергии','+500 к запасу',l=>1000*2**l],['rg','⚡','Скорость заряда','+1 энергия в секунду',l=>2000*2**l]];
const K='hamster-tycoon-v1';
let S={bal:0,tot:0,energy:1000,mt:0,el:0,rg:0,cards:{},fe:3,feDay:'',streak:0,lastDay:'',t:Date.now(),t0:Date.now(),cd:{},bn:0,bm:0,pid:'',tok:'',nm:'',av:'',reg:false,ed:0,wipe:-1,mid:-1};
const D0=JSON.stringify(S);
try{const r=localStorage.getItem(K);if(r)Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const f=n=>{n=Math.floor(n);if(n<1e6)return n.toLocaleString('ru-RU');const u=['','K','M','B','T'];let i=0;while(n>=1000&&i<4){n/=1000;i++}return(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i]};
const today=()=>new Date().toDateString();
const mx=()=>1000+500*S.el,rg=()=>1+S.rg,tv=()=>1+S.mt;
const lv=id=>S.cards[id]||0;
const cost=c=>Math.round(c[4]*1.5**lv(c[0]));
const pph=()=>CARDS.reduce((a,c)=>a+lv(c[0])*c[5],0);
const add=x=>{S.bal+=x;S.tot+=x};
const w=window.Telegram&&window.Telegram.WebApp,tg=w&&w.platform!=='unknown'?w:null;
const vib=n=>{try{if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred(n>10?'medium':'light');else navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)};
const lvl=()=>{let i=0;while(i<9&&S.tot>=LV[i+1])i++;return i};
const nd=()=>{const y=new Date(Date.now()-864e5).toDateString();return S.lastDay===y?S.streak+1:1};
let cat=0;
function tick(){
const n=Date.now(),dt=Math.min(Math.max((n-S.t)/1000,0),10800),g=pph()/3600*dt;
S.t=n;add(g);
if(S.ed){if(n-S.ed>=6e5){S.energy=mx();S.ed=0;toast('⚡ Энергия восстановлена')}}else S.energy=Math.min(mx(),S.energy+rg()*dt);
if(S.feDay!==today()){S.feDay=today();S.fe=3}
return[dt,g]}
const mmss=ms=>{const t=Math.max(0,Math.ceil(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function upd(){
const i=lvl();
$('balv').textContent=f(S.bal);
$('pph').textContent=f(pph());
$('rank').textContent=LN[i]+' '+(i+1)+'/10';
$('lvb').style.width=(i<9?(S.tot-LV[i])/(LV[i+1]-LV[i])*100:100)+'%';
$('env').textContent=f(S.energy)+' / '+f(mx())+(S.ed?' ⏳ '+mmss(6e5-(Date.now()-S.ed)):'');
$('enb').style.width=S.energy/mx()*100+'%'}
function aff(){document.querySelectorAll('[data-p]').forEach(e=>e.classList.toggle('off',S.bal<+e.dataset.p))}
function renderMine(){
$('cats').innerHTML=CN.map((n,i)=>`<button class="chip${i===cat?' on':''}" data-c="${i}">${n}</button>`).join('');
$('list').innerHTML=CARDS.filter(c=>c[3]===cat).map(c=>{const p=cost(c);return`<button class="card${S.bal<p?' off':''}" data-id="${c[0]}" data-p="${p}"><span class="e">${c[1]}</span><b>${c[2]}</b><small>Прибыль в час</small><em>+${f(c[5])}</em><div class="ft"><span>Ур. ${lv(c[0])}</span><span>🪙 ${f(p)}</span></div></button>`}).join('')}
function renderBoosts(){
const done=S.lastDay===today(),n=nd(),r=R[(n-1)%7];
let h=`<button class="r2${done?' off':''}" data-b="daily"><span class="e">🎁</span><span class="t"><b>Ежедневная награда</b><small>${done?'Возвращайся завтра':'День '+n+' подряд: +'+f(r)}</small></span><span class="p">${done?'✓':'Забрать'}</span></button>`;
h+=`<button class="r2${S.fe?'':' off'}" data-b="fe"><span class="e">🔥</span><span class="t"><b>Полная энергия</b><small>Сегодня осталось ${S.fe} из 3</small></span><span class="p">Зарядить</span></button>`;
B.forEach(b=>{const l=S[b[0]],p=b[4](l);h+=`<button class="r2${S.bal<p?' off':''}" data-b="${b[0]}" data-p="${p}"><span class="e">${b[1]}</span><span class="t"><b>${b[2]}</b><small>Ур. ${l}: ${b[3]}</small></span><span class="p">🪙 ${f(p)}</span></button>`});
$('boosts').innerHTML=h}
function buy(id){
const c=CARDS.find(x=>x[0]===id),p=cost(c);
if(S.bal<p)return toast('Не хватает монет');
S.bal-=p;S.cards[id]=lv(id)+1;vib(15);renderMine();upd();save()}
function boost(k){
if(k==='daily'){if(S.lastDay===today())return;const n=nd(),r=R[(n-1)%7];S.streak=n;S.lastDay=today();add(r);toast('🎁 Награда: +'+f(r))}
else if(k==='fe'){if(!S.fe)return toast('На сегодня зарядки закончились');S.fe--;S.energy=mx();S.ed=0;toast('🔥 Энергия полная')}
else{const b=B.find(x=>x[0]===k),p=b[4](S[k]);if(S.bal<p)return toast('Не хватает монет');S.bal-=p;S[k]++;toast(b[2]+': уровень '+S[k])}
vib(15);renderBoosts();upd();save()}
function go(v){
document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
document.querySelectorAll('nav button').forEach(e=>e.classList.toggle('on',e.dataset.v===v));
if(v==='mine')renderMine();
if(v==='boost')renderBoosts();
if(v==='games')renderGames();
if(v==='top')renderTop();
if(v==='me')renderProfile()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('v-mine').onclick=e=>{const b=e.target.closest('[data-c],[data-id]');if(!b)return;if(b.dataset.id)buy(b.dataset.id);else{cat=+b.dataset.c;renderMine()}};
$('boosts').onclick=e=>{const b=e.target.closest('[data-b]');if(b)boost(b.dataset.b)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BOTS=[['Кот Босс',400000,3500],['Крипто Кот',150000,1800],['Сэр Орех',60000,900],['Банкир Бобёр',25000,500],['Леди Семечка',12000,260],['Барсук Биткоин',7000,150],['Енот Инвестор',4000,80],['Тихий Суслик',1500,30]];
const pname=()=>{if(S.nm)return S.nm;try{const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u&&u.first_name)return u.first_name}catch(e){}return'Игрок'};
const unit=()=>Math.round(20+pph()/200);
const cdLeft=k=>Math.max(0,Math.ceil(((S.cd[k]||0)+3e5-Date.now())/1000));
let stop=null,tk=0;
function renderBots(m){
const h=(Date.now()-S.t0)/36e5;
const L=BOTS.map(b=>[b[0],b[1]+b[2]*h,0]);
L.push([pname(),S.tot,1]);
L.sort((a,b)=>b[1]-a[1]);
let x='<p class="note">'+(m||'Соперники здесь боты. Онлайн-рейтинг пока не подключён.')+'</p>';
x+=L.map((r,i)=>`<div class="lb${r[2]?' me':''}"><span class="n">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="nm">${esc(r[0])}${r[2]?' (ты)':''}</span><span class="sc">🪙 ${f(r[1])}</span></div>`).join('');
x+=`<h3>Мои рекорды</h3><div class="lb"><span class="nm">🌰 Орехопад</span><span class="sc">${S.bn} орехов</span></div><div class="lb"><span class="nm">🧠 Память</span><span class="sc">${S.bm?S.bm+' ходов':'пока нет'}</span></div>`;
$('tp').innerHTML=x}
function renderGames(){
const G=[['nut','🌰','Орехопад','Лови орешки 20 секунд, алмаз даёт x3.'],['mem','🧠','Память','Найди все пары за минимум ходов.']];
$('gl').innerHTML='<p class="note">Каждую игру можно проходить раз в 5 минут. Награда растёт вместе с твоей прибылью.</p>'+G.map(g=>{const c=cdLeft(g[0]);return`<button class="r2${c?' off':''}" data-g="${g[0]}"><span class="e">${g[1]}</span><span class="t"><b>${g[2]}</b><small>${c?'Доступно через '+Math.floor(c/60)+':'+String(c%60).padStart(2,'0'):g[3]}</small></span><span class="p">${c?'⏳':'Играть'}</span></button>`}).join('')}
$('gl').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;const k=b.dataset.g;if(cdLeft(k))return toast('Ещё рано, подожди');if(k==='nut')playNut();else playMem()};
function ovOpen(t){$('arena').style.overflow='';$('ovt').textContent=t;$('arena').innerHTML='';$('ov').classList.add('on')}
function ovClose(){if(stop){stop();stop=null}$('ov').classList.remove('on');$('arena').innerHTML='';renderGames();upd()}
$('ovx').onclick=ovClose;
function finish(k,reward,line){
if(stop){stop();stop=null}
S.cd[k]=Date.now();add(reward);save();upd();
$('ovt').textContent='Готово';
$('arena').innerHTML=`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px"><div style="font-size:56px">🎉</div><b style="font-size:20px">${line}</b><b style="font-size:28px">+${f(reward)} 🪙</b><button class="chip on" id="okb">Забрать</button></div>`;
$('okb').onclick=ovClose}
function playNut(){
ovOpen('');
const a=$('arena');let left=20,got=0;
const show=()=>{$('ovt').textContent='🌰 '+got+', осталось '+left+' с'};show();
const sp=setInterval(()=>{
const n=document.createElement('div');n.className='nut';
n.textContent=Math.random()<.12?'💎':'🌰';
n.style.left=Math.random()*Math.max(10,a.clientWidth-50)+'px';
n.style.animationDuration=(1.6+Math.random()*1.4)+'s';
n.onpointerdown=ev=>{ev.preventDefault();got+=n.textContent==='💎'?3:1;n.remove();vib(8);show()};
n.onanimationend=()=>n.remove();
a.appendChild(n)},420);
const cd=setInterval(()=>{left--;show();if(left<=0){if(got>S.bn)S.bn=got;finish('nut',got*unit(),'Поймано орехов: '+got)}},1000);
stop=()=>{clearInterval(sp);clearInterval(cd)}}
function playMem(){
ovOpen('');
const E=['🌰','🍎','🥕','🌻','🧀','🍓'],d=[...E,...E].sort(()=>Math.random()-.5);
let open=[],moves=0,done=0,lock=false;
const a=$('arena');
a.innerHTML='<div class="mem">'+d.map((e,i)=>`<button class="mc" data-i="${i}"></button>`).join('')+'</div>';
const cs=a.querySelectorAll('.mc'),hd=()=>{$('ovt').textContent='🧠 Ходов: '+moves};hd();
cs.forEach(c=>c.onclick=()=>{
const i=+c.dataset.i;
if(lock||c.classList.contains('up')||c.classList.contains('ok'))return;
c.classList.add('up');c.textContent=d[i];open.push(i);
if(open.length<2)return;
moves++;hd();
const x=open[0],y=open[1];open=[];
if(d[x]===d[y]){
cs[x].classList.replace('up','ok');cs[y].classList.replace('up','ok');
if(++done===6){if(!S.bm||moves<S.bm)S.bm=moves;setTimeout(()=>finish('mem',Math.max(3,16-moves)*unit(),'Ходов: '+moves),500)}
}else{lock=true;setTimeout(()=>{cs[x].classList.remove('up');cs[y].classList.remove('up');cs[x].textContent='';cs[y].textContent='';lock=false},700)}
});
stop=()=>{lock=true}}
const SB_URL='https://nuglhtpjzjfaafspmhln.supabase.co',SB_KEY='sb_publishable_o_QpiG1TPp-YBunMuWDdKA_2kg2ffqu';
const online=()=>!!(SB_URL&&SB_KEY);
const rid=()=>{try{return crypto.randomUUID().replace(/-/g,'')}catch(e){return Math.random().toString(36).slice(2)+Date.now().toString(36)}};
if(!S.pid){S.pid=rid();S.tok=rid()+rid()}
if(!S.av)S.av='🐱';
let sy=0;
const EM=['🐱','🐭','🦊','🐹','🐸','🦁','🐼','🦄'];
const av=(a,s)=>{s=s||36;a=String(a||'🐱');return a.indexOf('data:image/jpeg;base64,')===0?`<img src="${esc(a)}" width="${s}" height="${s}" style="border-radius:50%;object-fit:cover;flex:none" alt="">`:`<span style="width:${s}px;height:${s}px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:${Math.round(s*.55)}px;flex:none">${esc(a.slice(0,8))}</span>`};
async function sb(path,opt){
const h={apikey:SB_KEY,'Content-Type':'application/json'};
if(SB_KEY.indexOf('eyJ')===0)h.Authorization='Bearer '+SB_KEY;
const r=await fetch(SB_URL+'/rest/v1/'+path,Object.assign({headers:h},opt));
if(!r.ok)throw new Error(r.status);
const t=await r.text();return t?JSON.parse(t):null}
async function syncNow(){
if(!online()||!S.reg||S.bnd)return false;
try{await sb('rpc/save_player',{method:'POST',body:JSON.stringify({p_id:S.pid,p_token:S.tok,p_name:pname(),p_avatar:S.av,p_score:Math.floor(S.tot)})});return true}catch(e){return false}}
async function renderTop(){
if(!online())return renderBots();
if(!$('tp').innerHTML)$('tp').innerHTML='<p class="note">Загрузка…</p>';
await syncNow();
try{
const rows=await sb('leaderboard?select=id,name,avatar,score&order=score.desc&limit=50');
if(!$('v-top').classList.contains('on'))return;
let me=false;
let x='<p class="note">Рейтинг живых игроков по заработанным монетам.</p>';
x+=rows.map((r,i)=>{const m=r.id===S.pid;if(m)me=true;return`<div class="lb${m?' me':''}"><span class="n">${i<3?['🥇','🥈','🥉'][i]:i+1}</span>${av(r.avatar)}<span class="nm">${esc(r.name)}${m?' (ты)':''}</span><span class="sc">🪙 ${f(r.score)}</span></div>`}).join('');
if(!me)x+=S.reg?`<div class="lb me"><span class="n">…</span>${av(S.av)}<span class="nm">${esc(pname())} (ты)</span><span class="sc">🪙 ${f(S.tot)}</span></div>`:'<p class="note">Чтобы попасть в рейтинг, сохрани профиль во вкладке «Профиль».</p>';
$('tp').innerHTML=x
}catch(e){renderBots('Не удалось загрузить онлайн-рейтинг, показываю ботов.')}}
function renderProfile(){
$('pf').innerHTML=`<div style="display:flex;justify-content:center;margin:6px 0 12px">${av(S.av,92)}</div>
<div style="display:flex;justify-content:center;margin-bottom:12px"><button class="chip on" id="pbtn">Загрузить своё фото</button></div>
<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px">${EM.map(e=>`<button class="chip${S.av===e?' on':''}" data-e="${e}" style="font-size:22px">${e}</button>`).join('')}</div>
<div class="note">Никнейм</div>
<input id="pnm" maxlength="20" value="${esc(pname())}" style="width:100%;font:inherit;font-weight:800;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);user-select:text;-webkit-user-select:text">
<button class="r2" id="psv" style="margin-top:12px;justify-content:center"><b>Сохранить профиль</b></button>
<p class="note">${online()?'После сохранения ник, фото и число заработанных монет увидят все игроки в рейтинге.':'Онлайн-рейтинг пока не подключён, профиль хранится только на этом телефоне.'}</p>
<h3 id="h3s">Статистика</h3>
<div class="lb"><span class="nm">Всего заработано</span><span class="sc">🪙 ${f(S.tot)}</span></div>
<div class="lb"><span class="nm">Звание</span><span class="sc">${LN[lvl()]}</span></div>
<div class="lb"><span class="nm">Рекорд Орехопада</span><span class="sc">${S.bn}</span></div>
<div class="lb"><span class="nm">Рекорд Памяти</span><span class="sc">${S.bm?S.bm+' ходов':'пока нет'}</span></div>`}
const keep=()=>{const v=$('pnm');if(v){const t=v.value.trim().slice(0,20);if(t)S.nm=t}};
$('pf').onclick=e=>{
if(e.target.id==='h3s'){if(++ac>=7){ac=0;if(online())openAdmin();else toast('Нужен онлайн-режим')}return}
const b=e.target.closest('button');if(!b)return;
keep();
if(b.dataset.e){S.av=b.dataset.e;save();renderProfile()}
else if(b.id==='pbtn')$('pfile').click();
else if(b.id==='psv'){S.reg=true;save();renderProfile();syncNow().then(ok=>toast(online()?(ok?'Профиль сохранён':'Не удалось отправить, попробуй позже'):'Профиль сохранён на телефоне'))}};
$('pfile').onchange=e=>{
const fl=e.target.files[0];e.target.value='';if(!fl)return;
const rd=new FileReader();
rd.onload=()=>{const im=new Image();im.onload=()=>{
const c=document.createElement('canvas');c.width=c.height=64;
const m=Math.min(im.width,im.height);
c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,64,64);
S.av=c.toDataURL('image/jpeg',.7);save();renderProfile()};
im.src=rd.result};
rd.readAsDataURL(fl)};
let ac=0,AP='',sel='';
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);return m<1?'сейчас':m<60?m+' мин назад':m<1440?Math.round(m/60)+' ч назад':Math.round(m/1440)+' дн назад'};
function rain(){for(let i=0;i<30;i++){const e=document.createElement('div');e.className='rn';e.textContent='🐱';e.style.left=Math.random()*92+'vw';e.style.animationDelay=Math.random()*2+'s';e.onanimationend=()=>e.remove();document.body.appendChild(e)}}
function notice(t,fx){const d=document.createElement('div');d.className='nt';d.innerHTML='<div><b>📢 Сообщение от админа</b><p>'+esc(t)+'</p><button class="chip on">Ок</button></div>';d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d);if(fx==='rain')rain()}
function wipeLocal(id){
const keep={};['pid','tok','nm','av','reg'].forEach(k=>keep[k]=S[k]);
S=Object.assign(JSON.parse(D0),keep,{wipe:id,mid:S.mid,t:Date.now(),t0:Date.now()});
save();renderMine();upd();notice('Вайп! Все начинают игру заново.');
sb('rpc/reset_me',{method:'POST',body:JSON.stringify({p_id:S.pid,p_token:S.tok})}).catch(()=>{}).then(()=>syncNow())}
async function poll(){
if(!online())return;
try{
const c=await sb('rpc/get_cfg',{method:'POST',body:'{}'});
if(c){
if(S.wipe<0)S.wipe=c.wipe_id;else if(c.wipe_id>S.wipe)wipeLocal(c.wipe_id);
if(S.mid<0)S.mid=c.msg_id;else if(c.msg_id>S.mid){S.mid=c.msg_id;if(c.msg)notice(c.msg,c.fx)}
save()}
if(S.reg){
const st=await sb('rpc/get_status',{method:'POST',body:JSON.stringify({p_id:S.pid,p_token:S.tok})});
if(st&&st.gone){goneLocal();return}
if(st&&st.banned){showBan(st.reason);return}
hideBan();
const g=await sb('rpc/get_inbox',{method:'POST',body:JSON.stringify({p_id:S.pid,p_token:S.tok})});
(g||[]).forEach(x=>{const a=+x.amount||0,p=[];
if(a){S.bal=Math.max(0,S.bal+a);S.tot=Math.max(0,S.tot+a);p.push(a>0?'Тебе начислено +'+f(a)+' 🪙':'У тебя списано '+f(-a)+' 🪙')}
if(x.msg)p.push(x.msg);
notice(p.join('. ')||'Привет!',x.fx)});
if(g&&g.length){upd();save()}}
}catch(e){}}
setTimeout(poll,1500);
async function ar(fn,args){return sb('rpc/'+fn,{method:'POST',body:JSON.stringify(Object.assign({p_pass:AP},args||{}))})}
function openAdmin(){
ovOpen('🔧 Админ');
const a=$('arena');a.style.overflow='auto';
a.innerHTML='<div style="padding:16px"><div class="note">Пароль админа</div><input id="apw" type="password" class="inp"><button class="r2" id="ago" style="margin-top:10px;justify-content:center"><b>Войти</b></button></div>';
$('ago').onclick=async()=>{AP=$('apw').value;try{await ar('admin_list');panel()}catch(e){AP='';toast('Неверный пароль или нет связи')}}}
async function panel(){
let L;try{L=await ar('admin_list')}catch(e){toast('Ошибка загрузки');return}
$('arena').innerHTML=`<div style="padding:12px">
<div class="note">Игроки: ${L.length}. Нажми на игрока, чтобы выбрать.</div>
${L.map(p=>`<button class="lb${p.id===sel?' me':''}" data-id="${esc(p.id)}" style="width:100%;text-align:left">${av(p.avatar,30)}<span class="nm">${p.banned?'🚫 ':''}${esc(p.name)}</span><span class="sc">🪙 ${f(p.score)}<br><small>${ago(p.updated_at)}</small></span></button>`).join('')}
<h3>Выбранный игрок</h3>
<input id="amt" class="inp" type="number" placeholder="Монеты (можно с минусом)">
<input id="pmsg" class="inp" placeholder="Сообщение игроку (необязательно)">
<div class="arow"><button class="chip on" data-a="give">Отправить</button><button class="chip" data-a="rain">🐱 Дождь</button></div>
<input id="pnn" class="inp" placeholder="Новый ник игроку">
<div class="arow"><button class="chip on" data-a="name">Сменить ник</button><button class="chip" data-a="unname">Вернуть ник</button></div>
<div class="arow"><button class="chip" data-a="ban">🚫 Бан</button><button class="chip" data-a="unban">✅ Разбан</button><button class="chip" data-a="del">🗑 Удалить</button></div>
<h3>Всем игрокам</h3>
<input id="bmsg" class="inp" placeholder="Сообщение всем">
<div class="arow"><button class="chip on" data-a="bc">Отправить</button><button class="chip" data-a="bcr">🐱 С дождём</button></div>
<button class="r2" data-a="wipe" style="margin-top:14px;justify-content:center"><b>💥 Вайп всех</b></button></div>`}
$('arena').onclick=async e=>{
if(!AP||$('ovt').textContent.indexOf('Админ')<0)return;
const b=e.target.closest('[data-a],[data-id]');if(!b)return;
if(b.dataset.id){sel=b.dataset.id;return panel()}
const k=b.dataset.a,v=i=>$(i).value.trim();
try{
if(k==='give'||k==='rain'){if(!sel)return toast('Выбери игрока');await ar('admin_give',{p_id:sel,p_amount:Math.trunc(+v('amt')||0),p_msg:v('pmsg'),p_fx:k==='rain'?'rain':''});toast('Отправлено')}
else if(k==='name'||k==='unname'){if(!sel)return toast('Выбери игрока');await ar('admin_rename',{p_id:sel,p_name:k==='name'?v('pnn'):''});toast('Готово')}
else if(k==='bc'||k==='bcr'){await ar('admin_broadcast',{p_msg:v('bmsg'),p_fx:k==='bcr'?'rain':''});toast('Отправлено всем')}
else if(k==='ban'||k==='unban'){if(!sel)return toast('Выбери игрока');await ar('admin_ban',{p_id:sel,p_ban:k==='ban',p_reason:v('pmsg')});toast(k==='ban'?'Забанен':'Разбанен')}
else if(k==='del'){if(!sel)return toast('Выбери игрока');if(b.dataset.s!=='1'){b.dataset.s='1';const o=b.textContent;b.textContent='Точно?';setTimeout(()=>{b.dataset.s='';b.textContent=o},4000);return}await ar('admin_delete',{p_id:sel});sel='';toast('Аккаунт удалён')}
else if(k==='wipe'){
if(b.dataset.s!=='1'){b.dataset.s='1';b.firstChild.textContent='Точно? Нажми ещё раз';setTimeout(()=>{b.dataset.s='';b.firstChild.textContent='💥 Вайп всех'},4000);return}
await ar('admin_wipe');toast('Вайп выполнен')}
panel()
}catch(err){toast('Ошибка: '+err.message)}};
function showBan(r){S.bnd=1;S.bnr=r||'';save();let d=$('bn');if(!d){d=document.createElement('div');d.id='bn';d.className='nt';document.body.appendChild(d)}d.innerHTML='<div><b>🚫 Аккаунт заблокирован</b><p>'+esc(S.bnr||'Администратор ограничил доступ к игре.')+'</p></div>'}
function hideBan(){if(S.bnd){S.bnd=0;S.bnr='';save()}const d=$('bn');if(d)d.remove()}
function goneLocal(){hideBan();S=Object.assign(JSON.parse(D0),{pid:rid(),tok:rid()+rid(),av:'🐱',wipe:S.wipe,mid:S.mid,t:Date.now(),t0:Date.now()});save();renderMine();upd();notice('Твой аккаунт был удалён администратором. Можно начать заново.')}
if(S.bnd)showBan(S.bnr);
const ham=$('ham');let ht;
function hit(){ham.classList.remove('hit');void ham.offsetWidth;ham.classList.add('hit');clearTimeout(ht);ht=setTimeout(()=>ham.classList.remove('hit'),180)}
ham.oncontextmenu=e=>e.preventDefault();
ham.addEventListener('pointerdown',e=>{
e.preventDefault();
const v=tv();
if(S.energy<v){if(!S.ed)S.ed=Date.now();return toast('Энергия закончилась, восстановится через '+mmss(6e5-(Date.now()-S.ed)))}
S.energy-=v;add(v);if(S.energy<tv())S.ed=Date.now();
const r=ham.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;
ham.style.transform=`perspective(600px) rotateX(${-dy*20}deg) rotateY(${dx*20}deg) scale(.95)`;
const n=document.createElement('div');n.className='fl';n.textContent='+'+v;n.style.left=e.clientX+'px';n.style.top=(e.clientY-30)+'px';
document.body.appendChild(n);n.onanimationend=()=>n.remove();
vib(6);hit();upd()});
['pointerup','pointercancel','pointerleave'].forEach(t=>ham.addEventListener(t,()=>{ham.style.transform=''}));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('pagehide',save);
if(tg){try{tg.ready();tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes()}catch(e){}}
const[dt,g]=tick();
upd();
if(dt>60&&g>=1)toast('💤 Пока тебя не было: +'+f(g));
setInterval(()=>{tick();upd();aff();save();if($('v-games').classList.contains('on')&&(cdLeft('nut')||cdLeft('mem')))renderGames();if($('v-top').classList.contains('on')&&tk++%15===0)renderTop();if(++sy%30===0){syncNow();poll()}},1000);
})();
</script>
